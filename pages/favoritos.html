<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favoritos | Fundação Comics</title>

    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


<div id="header"></div>


<div id="auth"></div>


<main class="colecao-page favoritos-page">


    <div class="container">


        <section class="perfil-colecao">


            <h1>
                <i class="fa-solid fa-heart"></i>
                Favoritos
            </h1>


            <div id="listaFavoritos" class="hq-grid"></div>


        </section>


    </div>


</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script defer src="../js/supabase.js"></script>

<script defer src="../js/auth.js"></script>
<script defer src="../js/auth-ui.js"></script>

<script defer src="../js/carregar-catalogo.js"></script>
<script defer src="../js/favoritos-page.js"></script>

<script defer src="../js/colecoes-page.js"></script>

<script defer src="../js/components.js"></script>
<script defer src="../js/doacao.js"></script>

<script defer src="../js/busca.js"></script>
<script defer src="../js/mobile-menu.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {


    verificarLoginColecao();


});


function verificarLoginColecao(){


    if (!Auth.isLogged()) {


        window.location.href = "../index.html";

        return;


    }


    carregarFavoritos();


}


window.addEventListener("authChanged", () => {


    verificarLoginColecao();


});

</script>

</body>

</html>
