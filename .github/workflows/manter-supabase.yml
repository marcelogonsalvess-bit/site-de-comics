name: Manter Supabase ativo

on:
  schedule:
  - cron: "23 12 * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar banco Supabase
        run: |
          curl -f "https://gncfjvtpwvttgmzkmnxr.supabase.co/rest/v1/hqs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
