
name: Manter Supabase ativo

on:
  schedule:
    - cron: "23 0,6,12,18 * * *"

  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar banco Supabase
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 10 \
            "https://gncfjvtpwvttgmzkmnxr.supabase.co/rest/v1/hqs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
